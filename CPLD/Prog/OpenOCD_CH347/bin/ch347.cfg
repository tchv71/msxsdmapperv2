# 指定CH347-JTAG 调试器
adapter driver ch347
ch347 vid_pid 0x1a86 0x55dd

# 设置TCK时钟频率
adapter speed 200

#source [find cpld/xilinx-xc7.cfg]
#source [find cpld/jtagspi.cfg]

# ==========================================
# 2. ОПРЕДЕЛЕНИЕ СКАНИРОВАНИЯ JTAG (TAP)
# ==========================================
# Длина регистра команд (IR Length) для всей серии XC9500/XL составляет 8 бит.
# Выберите ID вашего чипа из таблицы ниже или закомментируйте строку -expected-id,
# чтобы OpenOCD просто считал его из цепочки автоматически.

jtag newtap xc9500 tap -irlen 8 -expected-id 0x59608093
#jtag newtap xc9500 tap -irlen 8 -expected-id 0x2c152093
# Команда для инициализации JTAG цепочки
init
scan_chain